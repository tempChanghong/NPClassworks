name: Frontend and backend contracts and fullstack smoke

on:
  workflow_call:
    inputs:
      backend_ref:
        description: Backend branch, tag or commit to check
        default: main
        required: false
        type: string
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag or commit to check
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPClassworksKV
          ref: ${{ inputs.backend_ref || 'main' }}
          path: .contract-backend
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .contract-backend
      - name: Test actual consumer and producer modules
        run: pnpm test:contracts
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test production PWA with real backend and disposable PostgreSQL
        run: pnpm test:e2e:fullstack
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullstack-test-results
          path: test-results/
          retention-days: 7
