name: Frontend and backend contracts and fullstack smoke

on:
  workflow_call:
    outputs:
      backend_commit:
        description: Backend commit that passed the contract and fullstack gates
        value: ${{ jobs.contracts.outputs.backend_commit }}
      frontend_commit:
        description: Frontend commit that passed the contract and fullstack gates
        value: ${{ jobs.contracts.outputs.frontend_commit }}
    inputs:
      frontend_ref:
        description: Frontend revision to test (empty uses caller revision)
        default: ''
        required: false
        type: string
      backend_ref:
        description: Backend branch, tag or commit to check
        default: main
        required: false
        type: string
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch or immutable SHA to test without deploying
        default: ''
        required: false
        type: string
      backend_ref:
        description: Backend branch, tag or commit to check
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_commit: ${{ steps.tested_revisions.outputs.backend_commit }}
      frontend_commit: ${{ steps.tested_revisions.outputs.frontend_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frontend_ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPClassworksKV
          ref: ${{ inputs.backend_ref || 'main' }}
          path: .contract-backend
          persist-credentials: false
      - name: Record the tested revisions
        id: tested_revisions
        shell: bash
        run: |
          backend_sha="$(git -C .contract-backend rev-parse HEAD)"
          frontend_sha="$(git rev-parse HEAD)"
          printf 'backend_commit=%s\nfrontend_commit=%s\n' "$backend_sha" "$frontend_sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The nested checkout must not inherit the frontend pnpm workspace.
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: .contract-backend
      - name: Test actual consumer and producer modules
        run: pnpm test:contracts
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test production PWA with real backend and disposable PostgreSQL
        run: pnpm test:e2e:fullstack
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - name: Require N1 real browser and PostgreSQL acceptance (no skips)
        run: pnpm test:e2e:npep
        env:
          CLASSWORKS_BACKEND_ROOT: ${{ github.workspace }}/.contract-backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullstack-test-results
          path: test-results/
          retention-days: 7
