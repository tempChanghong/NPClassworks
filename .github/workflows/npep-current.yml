name: NPEP current three-repository acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Optional full NPEduTools SHA for replay
        type: string
        default: ''
      web_sha:
        description: Optional full NPClassworks SHA for replay
        type: string
        default: ''
      backend_sha:
        description: Optional full NPClassworksKV SHA for replay
        type: string
        default: ''

permissions:
  contents: read

jobs:
  current:
    # Merge the desktop provider workflow before enabling this caller.
    uses: tempChanghong/NPEduTools/.github/workflows/npep-current.yml@1466c2e81095c3833d7f24b489ae7d6a05be3e99
    with:
      desktop_sha: ${{ inputs.desktop_sha || (github.event_name == 'pull_request' && '1466c2e81095c3833d7f24b489ae7d6a05be3e99') || '' }}
      web_sha: ${{ inputs.web_sha || '' }}
      backend_sha: ${{ inputs.backend_sha || (github.event_name == 'pull_request' && 'c4afaaef66d64ee0d6f3c5f06ba158f80013c591') || '' }}
